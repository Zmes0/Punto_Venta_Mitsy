<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mesas - Mitsy's POS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
</head>
<body>
    <div class="top-bar">
        <h1>Mesas</h1>
        <div class="user-info">
            <span>{{ username }}</span>
            <button onclick="logout()" class="btn btn-small btn-danger">Cerrar Sesión</button>
        </div>
    </div>
    
    <div class="mesas-container">
        <div id="mesasGrid" class="mesas-grid">
            <!-- Las mesas se cargarán dinámicamente -->
        </div>
    </div>
    
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Cargando mesas...</p>
    </div>
    
    <script src="{{ url_for('static', filename='js/mesas.js') }}"></script>
</body>
</html>
